name: Build Release APK

on:
  push:
    branches: [main, fix/release-apk-gradle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Validate signing inputs and decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore"
          test -s "$RUNNER_TEMP/release-keystore"
          if ! keytool -exportcert -keystore "$RUNNER_TEMP/release-keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -rfc > "$RUNNER_TEMP/release-cert.pem" 2> "$RUNNER_TEMP/keytool-error.txt"; then
            if grep -qiE 'password was incorrect|password is incorrect|keystore was tampered' "$RUNNER_TEMP/release-cert.pem" "$RUNNER_TEMP/keytool-error.txt"; then
              echo 'Keystore could not be opened: the store password may be incorrect.' >&2
            elif grep -qiE 'alias .* does not exist|alias .* not found' "$RUNNER_TEMP/release-cert.pem" "$RUNNER_TEMP/keytool-error.txt"; then
              echo 'The configured key alias was not found in the keystore.' >&2
              if keytool -exportcert -keystore "$RUNNER_TEMP/release-keystore" -storepass:env KEYSTORE_PASSWORD -alias upload -rfc > "$RUNNER_TEMP/upload-cert-check.pem" 2>/dev/null && openssl x509 -in "$RUNNER_TEMP/upload-cert-check.pem" -noout >/dev/null 2>&1; then
                echo 'The alias configured in the existing app release configuration (upload) was found; confirm it is the intended production key before changing the secret.' >&2
              else
                echo 'The alias configured in the existing app release configuration (upload) was not found.' >&2
              fi
              rm -f "$RUNNER_TEMP/upload-cert-check.pem"
            elif grep -qiE 'invalid keystore format|unrecognized keystore format' "$RUNNER_TEMP/release-cert.pem" "$RUNNER_TEMP/keytool-error.txt"; then
              echo 'The decoded keystore has an invalid or unsupported format.' >&2
            else
              echo 'Unable to export a certificate from the provided release keystore; check keystore, store password and alias.' >&2
            fi
            exit 1
          fi
          openssl x509 -in "$RUNNER_TEMP/release-cert.pem" -noout >/dev/null
          echo 'Release keystore certificate exported successfully.'
          rm -f "$RUNNER_TEMP/keytool-error.txt"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release-keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Verify APK signature matches release keystore
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$aapt"
          package_name=$("$aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [[ "$package_name" != 'com.skyplus.finance' ]]; then
            echo 'APK application ID does not match com.skyplus.finance.' >&2
            exit 1
          fi
          echo 'Verified APK application ID: com.skyplus.finance'
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-signature.txt"
          expected=$(openssl x509 -in "$RUNNER_TEMP/release-cert.pem" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | tr '[:upper:]' '[:lower:]')
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo 'APK signing certificate does not match the supplied release keystore.' >&2
            exit 1
          fi
          stat -c 'APK size: %s bytes' "$apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore" "$RUNNER_TEMP/release-cert.pem"
